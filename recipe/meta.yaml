{% set name = "fastapi" %}
{% set version = "0.128.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1cc179e1cef10a6be60ffe429f79b829dce99d8de32d7acb7e6c8dfdf7f2645a

build:
  number: 0
  skip: true  # [py<39]

requirements:
  host:
    - python

outputs:
  - name: fastapi-core
    build:
      script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
      entry_points:
        - fastapi = fastapi.cli:main
    requirements:
      host:
        - pip
        - python
        - pdm-backend
      run:
        - python
        - annotated-doc >=0.0.2
        - pydantic >=2.7.0
        - starlette >=0.40.0,<0.51.0
        - typing-extensions >=4.8.0
      run_constrained:
        - fastapi-cli >=0.0.8
        - httpx >=0.23.0,<1.0.0
        - jinja2 >=3.1.5
        - python-multipart >=0.0.18
        - itsdangerous >=1.1.0
        - pyyaml >=5.3.1
        - ujson >=4.0.1,!=4.0.2,!=4.1.0,!=4.2.0,!=4.3.0,!=5.0.0,!=5.1.0
        - orjson >=3.2.1
        - email-validator >=2.0.0
        - uvicorn >=0.12.0
        - pydantic-settings >=2.0.0
        - pydantic-extra-types >=2.0.0

    {% set deselect_tests = "--deselect=tests/test_fastapi_cli.py::test_fastapi_cli" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_custom_response/test_tutorial001.py::test_get_custom_response" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_path_operation_advanced_configurations/test_tutorial007.py::test_post" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_path_operation_advanced_configurations/test_tutorial007.py::test_post_broken_yaml" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_path_operation_advanced_configurations/test_tutorial007.py::test_post_invalid" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_path_operation_advanced_configurations/test_tutorial007.py::test_openapi_schema" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_response_model/test_tutorial003.py::test_post_user" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_response_model/test_tutorial003.py::test_openapi_schema" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_response_model/test_tutorial003_01.py::test_post_user" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_response_model/test_tutorial003_01.py::test_openapi_schema" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_login" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_login_incorrect_password" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_login_incorrect_username" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_no_token" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_token" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_incorrect_token" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_incorrect_token_type" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_verify_password" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_get_password_hash" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_create_access_token" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_token_no_sub" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_token_no_username" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_token_no_scope" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_token_nonexistent_user" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_token_inactive_user" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_read_items" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_read_system_status" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_read_system_status_no_token" %}
    {% set deselect_tests = deselect_tests + " --deselect=tests/test_tutorial/test_security/test_tutorial005.py::test_openapi_schema" %}

    # ModuleNotFoundError: No module named 'strawberry'.
    # strawberry-graphql is not available on the main channel.
    {% set ignore_tests = " --ignore=tests/test_tutorial/test_graphql/test_tutorial001.py" %}
    # pwdlib is not available on the main channel.
    {% set ignore_tests = ignore_tests + " --ignore=tests/test_tutorial/test_security/test_tutorial004.py" %}
    # pydantic.errors.PydanticUserError: Field 'id' requires a type annotation
    {% set ignore_tests = ignore_tests + " --ignore=tests/test_tutorial/test_sql_databases/test_tutorial001.py" %}
    {% set ignore_tests = ignore_tests + " --ignore=tests/test_tutorial/test_sql_databases/test_tutorial002.py" %}
    # Skip a problematic test because werkzeug don't have a full support of Python 3.14:
    # "AttributeError: module 'ast' has no attribute 'Str'"
    {% set ignore_tests = ignore_tests + " --ignore=tests/test_tutorial/test_wsgi/test_tutorial001.py" %}

    test:
      source_files:
        - tests
        - docs_src
        - docs
      imports:
        - fastapi
      requires:
        - anyio >=3.2.1,<5.0.0
        - dirty-equals >=0.9.0
        - email-validator >=2.0.0
        - flask >=1.1.2,<4.0.0
          # httpx is required only for testing fastapi  by using `from fastapi.testclient import TestClient`
        - httpx >=0.23.0,<1.0.0
        - inline-snapshot >=0.21.1
        - itsdangerous >=1.1.0
        - jinja2 >=3.1.5
        - orjson >=3.2.1
        - pip
        #- pydantic-extra-types >=2.0.0
        - pydantic-settings >=2.0.0
        - pyjwt >=2.9.0
        - pytest >=7.1.3,<9.0.0
        - pytest-codspeed >=4.2.0
        - python-multipart >=0.0.18
        - pyyaml >=5.3.1,<7.0.0
        - sqlalchemy
        - sqlmodel
        - trio
        - ujson >=4.0.1,!=4.0.2,!=4.1.0,!=4.2.0,!=4.3.0,!=5.0.0,!=5.1.0
        - uvicorn >=0.12.0
      commands:
        - pip check
        # fastapi cli call is impossible as fastapi-cli package is missing
        - pytest -v tests {{ ignore_tests }} {{ deselect_tests }}

    about:
      home: https://github.com/fastapi/fastapi
      license: MIT
      license_family: MIT
      license_file: LICENSE
      summary: FastAPI framework, high performance, easy to learn, fast to code, ready for production
      description: |
        FastAPI is a modern, fast (high-performance), web framework for building APIs with Python 3.7+ based on standard Python type hints.
        The key features are:
        - Fast: Very high performance, on par with NodeJS and Go (thanks to Starlette and Pydantic). One of the fastest Python frameworks available.
        - Fast to code: Increase the speed to develop features by about 200% to 300%. *
        - Fewer bugs: Reduce about 40% of human (developer) induced errors. *
        - Intuitive: Great editor support. Completion everywhere. Less time debugging.
        - Easy: Designed to be easy to use and learn. Less time reading docs.
        - Short: Minimize code duplication. Multiple features from each parameter declaration. Fewer bugs.
        - Robust: Get production-ready code. With automatic interactive documentation.
        - Standards-based: Based on (and fully compatible with) the open standards for APIs: OpenAPI (previously known as Swagger) and JSON Schema.
      doc_url: https://fastapi.tiangolo.com
      dev_url: https://github.com/fastapi/fastapi

  - name: fastapi
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage("fastapi-core", exact=True) }}
        # [project.optional-dependencies.standard]
        - email_validator
        # TODO: add fastapi-cli and rich-toolkit.
        #- fastapi-cli
        - httpx
        - jinja2
        - pydantic-settings
        # TODO: rebuild pydantic-extra-types for py314.
        #- pydantic-extra-types
        - python-multipart
        # TODO: add uvicorn-standard.
        #- uvicorn-standard
    tests:
      imports:
        - fastapi
        - fastapi.cli
        - fastapi.dependencies
        - fastapi.middleware
        - fastapi.openapi
        - fastapi.security
      requires:
        - pip
      commands:
        - fastapi --version
        - fastapi --help
    about:
      home: https://github.com/fastapi/fastapi
      license: MIT
      license_family: MIT
      license_file: LICENSE
      summary: FastAPI framework, high performance, easy to learn, fast to code, ready for production
      description: |
        FastAPI is a modern, fast (high-performance), web framework for building APIs with Python 3.7+ based on standard Python type hints.
        The key features are:
        - Fast: Very high performance, on par with NodeJS and Go (thanks to Starlette and Pydantic). One of the fastest Python frameworks available.
        - Fast to code: Increase the speed to develop features by about 200% to 300%. *
        - Fewer bugs: Reduce about 40% of human (developer) induced errors. *
        - Intuitive: Great editor support. Completion everywhere. Less time debugging.
        - Easy: Designed to be easy to use and learn. Less time reading docs.
        - Short: Minimize code duplication. Multiple features from each parameter declaration. Fewer bugs.
        - Robust: Get production-ready code. With automatic interactive documentation.
        - Standards-based: Based on (and fully compatible with) the open standards for APIs: OpenAPI (previously known as Swagger) and JSON Schema.
      doc_url: https://fastapi.tiangolo.com
      dev_url: https://github.com/fastapi/fastapi

