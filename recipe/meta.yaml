# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#schema_version: 1

{% set version = "0.115.9" %}

package:
  name: fastapi
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi/fastapi-{{ version }}.tar.gz
  sha256: 9d7da3b196c5eed049bc769f9475cd55509a112fbe031c0ef2f53768ae68d13f
  patches:
    # this ships a `bin/fastapi` which says to install `fastapi-cli`
    # but as this recipe already depends on `fastapi-cli`, it clobbers the working one
    - 0000-no-broken-cli.patch

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pdm-backend
    - pip
    - python
  run:
    - python
    # [project.dependencies]
    - starlette
    - typing_extensions
    - pydantic
    # [project.optional-dependencies.standard]
    - email_validator
    - fastapi-cli
    - httpx
    - jinja2
    - python-multipart
    - uvicorn-standard 

tests:
  - python:
      pip_check: true
      python_version:
      imports:
        - fastapi
        - fastapi.dependencies
        - fastapi.middleware
        - fastapi.openapi
        - fastapi.security
  - requirements:
      run:
        - python
    script:
      - fastapi --version
      - fastapi --help

about:
  license: MIT
  license_file: LICENSE
  summary: FastAPI framework, high performance, easy to learn, fast to code, ready for production
  homepage: https://github.com/fastapi/fastapi
  repository: https://github.com/fastapi/fastapi
  documentation: https://fastapi.tiangolo.com

extra:
  anaconda-services:
    ref: https://anaconda.zendesk.com/agent/tickets/70829
    reason: Dependency for chromadb
  recipe-maintainers:
    - ianaobi
  recipe-maintainers:
    - dhirschfeld
    - tiangolo
    - synapticarbors
    - bollwyvl
