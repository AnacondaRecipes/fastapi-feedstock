{% set name = "fastapi" %}
{% set version = "0.128.0" %}

package:
  name: {{ name|lower }}-split
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1cc179e1cef10a6be60ffe429f79b829dce99d8de32d7acb7e6c8dfdf7f2645a

build:
  number: 0
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - pdm-backend

outputs:
  - name: {{ name }}-core
    script: build_base.bat  # [win]
    script: build_base.sh   # [not win]
    requirements:
      host:
        - python
        - pip
        - pdm-backend
      run:
        - python
        - annotated-doc >=0.0.2
        - pydantic >=2.7.0
        - starlette >=0.40.0,<0.51.0
        - typing-extensions >=4.8.0
      run_constrained:
        # [project.optional-dependencies.standard]
        - fastapi-cli >=0.0.8
        - httpx >=0.23.0,<1.0.0
        - jinja2 >=3.1.5
        - python-multipart >=0.0.18
        - itsdangerous >=1.1.0
        - pyyaml >=5.3.1
        - ujson >=4.0.1,!=4.0.2,!=4.1.0,!=4.2.0,!=4.3.0,!=5.0.0,!=5.1.0
        - orjson >=3.2.1
        - email-validator >=2.0.0
        - uvicorn-standard >=0.12.0
        - pydantic-settings >=2.0.0
        - pydantic-extra-types >=2.0.0
    test:
      imports:
        - fastapi
      requires:
        - pip
      commands:
        - pip check
        - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"

    about:
      home: https://github.com/fastapi/fastapi
      license: MIT
      license_family: MIT
      license_file: LICENSE
      summary: FastAPI framework, high performance, easy to learn, fast to code, ready for production
      description: |
        FastAPI is a modern, fast (high-performance), web framework for building APIs with Python 3.7+ based on standard Python type hints.
        The key features are:
        - Fast: Very high performance, on par with NodeJS and Go (thanks to Starlette and Pydantic). One of the fastest Python frameworks available.
        - Fast to code: Increase the speed to develop features by about 200% to 300%. *
        - Fewer bugs: Reduce about 40% of human (developer) induced errors. *
        - Intuitive: Great editor support. Completion everywhere. Less time debugging.
        - Easy: Designed to be easy to use and learn. Less time reading docs.
        - Short: Minimize code duplication. Multiple features from each parameter declaration. Fewer bugs.
        - Robust: Get production-ready code. With automatic interactive documentation.
        - Standards-based: Based on (and fully compatible with) the open standards for APIs: OpenAPI (previously known as Swagger) and JSON Schema.
      doc_url: https://fastapi.tiangolo.com
      dev_url: https://github.com/fastapi/fastapi

  - name: {{ name }}
    build:
      noarch: generic
      script: echo "Metapackage - no build steps required"
      # IMPORTANT: The entry point "fastapi" is provided by the 'fastapi-cli' package, so it is not needed here,
      # otherwise conda-build will throw a warning:
      # WARNING: Inexact overlap between bin/fastapi in packages fastapi and fastapi-core.
      # We test the 'fastapi' command in test.commands.
    requirements:
      run:
        - {{ pin_subpackage("fastapi-core", exact=True) }}
        # [project.optional-dependencies.standard]
        - email_validator
        - fastapi-cli
        - httpx
        - jinja2
        - pydantic-settings
        - pydantic-extra-types
        - python-multipart
        - uvicorn-standard
    test:
      imports:
        - fastapi
        - fastapi.dependencies
        - fastapi.middleware
        - fastapi.openapi
        - fastapi.security
      source_files:
        - tests
        - docs_src
        - docs
      requires:
        - anyio >=3.2.1,<5.0.0
        - dirty-equals >=0.9.0
        - email-validator >=2.0.0
        - flask >=1.1.2,<4.0.0
        # httpx is required only for testing fastapi by using `from fastapi.testclient import TestClient`
        - httpx >=0.23.0,<1.0.0
        - inline-snapshot >=0.21.1
        - itsdangerous >=1.1.0
        - jinja2 >=3.1.5
        - orjson >=3.2.1
        - pip
        - pydantic-extra-types >=2.0.0
        - pydantic-settings >=2.0.0
        - pyjwt >=2.9.0
        - pytest >=7.1.3,<9.0.0
        - pytest-codspeed >=4.2.0
        - python-multipart >=0.0.18
        - pyyaml >=5.3.1,<7.0.0
        - sqlalchemy
        - sqlmodel
        - trio
        - ujson >=4.0.1,!=4.0.2,!=4.1.0,!=4.2.0,!=4.3.0,!=5.0.0,!=5.1.0
        - uvicorn >=0.12.0
        - coverage
      commands:
        - pip check
        # Check fastapi-cli commands
        - fastapi --version
        - fastapi --help
        - fastapi dev --help
        - fastapi run --help
        # Run pytest with ignored tests:
        # [1] strawberry-graphql is not available on the main channel.
        # [2] pwdlib is not available on the main channel.
        # [3] pydantic.errors.PydanticUserError: Field 'id' requires a type annotation
        # [4] werkzeug doesn't have full support for Python 3.14
        - pytest -v tests --ignore=tests/test_tutorial/test_graphql/test_tutorial001.py --ignore=tests/test_tutorial/test_security/test_tutorial004.py --ignore=tests/test_tutorial/test_security/test_tutorial005.py --ignore=tests/test_tutorial/test_sql_databases/test_tutorial001.py --ignore=tests/test_tutorial/test_sql_databases/test_tutorial002.py --ignore=tests/test_tutorial/test_wsgi/test_tutorial001.py

    about:
      home: https://github.com/fastapi/fastapi
      license: MIT
      license_family: MIT
      license_file: LICENSE
      summary: FastAPI framework, high performance, easy to learn, fast to code, ready for production
      description: |
        FastAPI is a modern, fast (high-performance), web framework for building APIs with Python 3.7+ based on standard Python type hints.
        The key features are:
        - Fast: Very high performance, on par with NodeJS and Go (thanks to Starlette and Pydantic). One of the fastest Python frameworks available.
        - Fast to code: Increase the speed to develop features by about 200% to 300%. *
        - Fewer bugs: Reduce about 40% of human (developer) induced errors. *
        - Intuitive: Great editor support. Completion everywhere. Less time debugging.
        - Easy: Designed to be easy to use and learn. Less time reading docs.
        - Short: Minimize code duplication. Multiple features from each parameter declaration. Fewer bugs.
        - Robust: Get production-ready code. With automatic interactive documentation.
        - Standards-based: Based on (and fully compatible with) the open standards for APIs: OpenAPI (previously known as Swagger) and JSON Schema.
      doc_url: https://fastapi.tiangolo.com
      dev_url: https://github.com/fastapi/fastapi

  - name: {{ name }}-all
    build:
      noarch: generic
      script: echo "Metapackage - no build steps required"
    requirements:
      run:
        - {{ pin_subpackage("fastapi", exact=True) }}
        # [project.optional-dependencies.all] - additional packages on top of standard
        - itsdangerous >=1.1.0
        - pyyaml >=5.3.1
        - ujson >=4.0.1,!=4.0.2,!=4.1.0,!=4.2.0,!=4.3.0,!=5.0.0,!=5.1.0
        - orjson >=3.2.1
    test:
      imports:
        - fastapi
      requires:
        - pip
      commands:
        - pip check
        - fastapi --version

    about:
      home: https://github.com/fastapi/fastapi
      license: MIT
      license_family: MIT
      license_file: LICENSE
      summary: FastAPI framework with all optional dependencies
      description: |
        FastAPI is a modern, fast (high-performance), web framework for building APIs with Python 3.7+ based on standard Python type hints.
        This package includes all optional dependencies: itsdangerous, pyyaml, ujson, and orjson.
      doc_url: https://fastapi.tiangolo.com
      dev_url: https://github.com/fastapi/fastapi

about:
  home: https://github.com/fastapi/fastapi
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: FastAPI framework, high performance, easy to learn, fast to code, ready for production
  description: |
    FastAPI is a modern, fast (high-performance), web framework for building APIs with Python 3.7+ based on standard Python type hints.
    The key features are:
    - Fast: Very high performance, on par with NodeJS and Go (thanks to Starlette and Pydantic). One of the fastest Python frameworks available.
    - Fast to code: Increase the speed to develop features by about 200% to 300%. *
    - Fewer bugs: Reduce about 40% of human (developer) induced errors. *
    - Intuitive: Great editor support. Completion everywhere. Less time debugging.
    - Easy: Designed to be easy to use and learn. Less time reading docs.
    - Short: Minimize code duplication. Multiple features from each parameter declaration. Fewer bugs.
    - Robust: Get production-ready code. With automatic interactive documentation.
    - Standards-based: Based on (and fully compatible with) the open standards for APIs: OpenAPI (previously known as Swagger) and JSON Schema.
  doc_url: https://fastapi.tiangolo.com
  dev_url: https://github.com/fastapi/fastapi

extra:
  feedstock-name: fastapi
  recipe-maintainers:
    - dhirschfeld
    - tiangolo
    - synapticarbors
